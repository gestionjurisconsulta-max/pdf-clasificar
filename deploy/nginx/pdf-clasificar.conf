# Vhost para el nginx DEL HOST (no el del contenedor). Publica la aplicación
# con TLS y la reenvía al puerto que docker-compose deja en la interfaz local.
#
# Dónde se instala, según la distribución:
#   Rocky / AlmaLinux / RHEL -> /etc/nginx/conf.d/pdf-clasificar.conf
#   Debian / Ubuntu          -> /etc/nginx/sites-available/pdf-clasificar.conf
#                               más un enlace en sites-enabled/
# Y después: sudo nginx -t && sudo systemctl reload nginx
#
# OJO con el puerto del proxy_pass de abajo: tiene que ser el mismo que
# HTTP_PORT del .env. Viene con 8080, pero si otro proyecto ya lo ocupaba
# habrás tenido que cambiarlo, y el síntoma de no cuadrarlos es un 502.
#
# El bloque 443 necesita que el certificado YA exista, o nginx no arranca y se
# lleva por delante a los demás proyectos del VPS. El orden correcto está en
# docs/despliegue.md: primero un vhost temporal sólo HTTP, luego certbot, y
# entonces este fichero.

server {
    listen 80;
    listen [::]:80;
    server_name gestion.pdf.iages.es;

    # Las renovaciones de certbot por webroot se resuelven aquí, antes de la
    # redirección: si no, el challenge acaba en un 301 y la renovación falla.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 se activa aquí, en el listen, y no con la directiva `http2 on;`:
    # esa sólo existe desde nginx 1.25, y Debian 12 y Ubuntu 22.04/24.04
    # todavía traen versiones anteriores, donde es un "unknown directive" que
    # impide arrancar nginx entero. Desde 1.25 esta forma avisa de que está
    # obsoleta en `nginx -t`, pero sigue funcionando.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gestion.pdf.iages.es;

    ssl_certificate     /etc/letsencrypt/live/gestion.pdf.iages.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestion.pdf.iages.es/privkey.pem;

    # Los parámetros van aquí y no con un `include` de /etc/letsencrypt/: esos
    # ficheros sólo los deja certbot cuando se usa su plugin de nginx, y si se
    # obtuvo el certificado por webroot no existen y nginx no arranca.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Tiene que ir en línea con MAX_UPLOAD_BYTES del .env y con
    # client_max_body_size de docker/nginx.conf: manda el más restrictivo de
    # los tres, y el síntoma de no cuadrarlos es un 413 a mitad de subida.
    client_max_body_size 200M;

    # La aplicación no sirve nada que tenga sentido dentro de un iframe ajeno,
    # y HSTS evita que una primera visita se cuele por HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # El puerto tiene que coincidir con HTTP_PORT del .env. 127.0.0.1 y no
    # localhost: con localhost, nginx puede resolver a ::1 y dar 502, porque
    # el contenedor sólo publica en IPv4.
    location / {
        # La aplicación no tiene inicio de sesión: aísla a unos usuarios de
        # otros, pero no impide que un tercero la use. Descomenta esto para
        # cerrarla con una contraseña (ver "Quién puede entrar" en
        # docs/despliegue.md). Cubre también /api, y la SPA sigue funcionando
        # porque el navegador reenvía las credenciales.
        # auth_basic "PdfClasificar";
        # auth_basic_user_file /etc/nginx/.htpasswd-pdf-clasificar;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Procesar un lote con OCR puede tardar varios minutos. Con los 60s por
        # defecto, nginx corta la petición y el navegador ve un 504 aunque el
        # backend siga trabajando.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Sin esto, nginx almacena en disco el PDF entero antes de empezar a
        # pasarlo: con ficheros de 200 MB es una espera larga y un pico de I/O.
        proxy_request_buffering off;
    }
}
