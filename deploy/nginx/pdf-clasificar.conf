# PdfClasificar  ->  127.0.0.1:8080 (el puerto real, en HTTP_PORT del .env)
# La aplicacion escucha solo en loopback; nginx es lo unico expuesto.
#
# Vhost para el nginx DEL HOST, no para el de dentro del contenedor.
# Se instala en /etc/nginx/conf.d/pdf-clasificar.conf (Rocky y derivados) o en
# sites-available mas un enlace en sites-enabled (Debian y Ubuntu), y despues:
#   sudo nginx -t && sudo systemctl reload nginx
#
# OJO con el puerto del proxy_pass: tiene que ser el mismo que HTTP_PORT del
# .env. Viene con 8080, pero si otro proyecto ya lo ocupaba habras tenido que
# cambiarlo, y el sintoma de no cuadrarlos es un 502. El paso 7 de
# docs/despliegue.md lo ajusta solo al copiar el fichero.
#
# El bloque 443 necesita que el certificado YA exista, o nginx no arranca y se
# lleva por delante a los demas proyectos del VPS. El orden correcto esta en
# docs/despliegue.md: primero un vhost temporal solo HTTP, luego certbot, y
# entonces este fichero.

server {
    listen 80;
    server_name gestion.pdf.iages.es;

    # Las renovaciones de certbot por webroot se resuelven aqui, antes de la
    # redireccion: si no, el challenge acaba en un 301 y la renovacion falla.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Sin listen en IPv6, igual que el resto de vhosts de este VPS. Si este
    # fuera el unico server escuchando en [::]:443, pasaria a ser el default
    # de IPv6 y se quedaria con las peticiones IPv6 de CUALQUIER dominio de la
    # maquina, que recibirian el certificado equivocado.
    listen 443 ssl;
    # Directiva propia, no `listen ... http2`, porque el nginx del VPS es 1.26
    # y ahi esa forma esta obsoleta. Con nginx anterior a 1.25 hay que hacerlo
    # al reves: quitar esta linea y poner `listen 443 ssl http2;`.
    http2 on;
    server_name gestion.pdf.iages.es;

    ssl_certificate     /etc/letsencrypt/live/gestion.pdf.iages.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestion.pdf.iages.es/privkey.pem;

    # Los parametros van aqui y no con un `include` de /etc/letsencrypt/: esos
    # ficheros solo los deja certbot cuando se usa su plugin de nginx, y si se
    # obtuvo el certificado por webroot no existen y nginx no arranca.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Aqui van TODAS las cabeceras de seguridad, al reves que en cuadre-iva.conf,
    # donde solo va HSTS porque el nginx de dentro de aquel contenedor ya manda
    # las demas. El de este proyecto (docker/nginx.conf) no manda ninguna: solo
    # Cache-Control. Si algun dia se le añaden alli, hay que quitarlas de aqui
    # para no duplicarlas.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tiene que ir en linea con MAX_UPLOAD_BYTES del .env y con
    # client_max_body_size de docker/nginx.conf: manda el mas restrictivo de
    # los tres, y el sintoma de no cuadrarlos es un 413 a mitad de subida.
    client_max_body_size 200M;
    # Un PDF de 200 MB por una linea lenta tarda mas que el minuto por defecto.
    client_body_timeout 300s;

    location / {
        # La aplicacion no tiene inicio de sesion: aisla a unos usuarios de
        # otros, pero no impide que un tercero la use. Descomenta esto para
        # cerrarla con una contraseña (ver "Quien puede entrar" en
        # docs/despliegue.md). Cubre tambien /api, y la SPA sigue funcionando
        # porque el navegador reenvia las credenciales.
        # auth_basic "PdfClasificar";
        # auth_basic_user_file /etc/nginx/.htpasswd-pdf-clasificar;

        # 127.0.0.1 y no localhost: con localhost, nginx puede resolver a ::1,
        # donde el contenedor no escucha, y eso da un 502.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Procesar un lote con OCR puede tardar varios minutos. Con los 60s por
        # defecto, nginx corta la peticion y el navegador ve un 504 aunque el
        # backend siga trabajando. El nginx de dentro da 600s: aqui no hay que
        # cortar antes que el.
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;

        # Los PDF suben enteros y el ZIP baja entero: sin bufear en disco. Sin
        # esto, nginx almacena los 200 MB antes de empezar a pasarlos.
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
