server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los PDF y los Excel de un lote pueden ser grandes. Este límite tiene que
    # ir en línea con max_upload_bytes del backend.
    client_max_body_size 200M;

    # Tipos MIME que la configuración por defecto no conoce y que pdf.js
    # necesita: sin ellos Chrome bloquea el worker y getDocument() se cuelga.
    types {
        application/wasm  wasm;
        text/javascript   js mjs;
        application/octet-stream  bcmap pfb icc;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Procesar un lote grande con OCR puede tardar. Sin esto, nginx corta
        # la subida o la descarga del ZIP a los 60 segundos.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # Los assets llevan hash en el nombre, así que se pueden cachear para
    # siempre sin riesgo de servir una versión vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index.html NO se cachea: es lo que apunta a los assets con hash.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA: cualquier ruta desconocida devuelve el index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
