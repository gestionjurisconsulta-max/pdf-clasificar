server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los PDF y los Excel de un lote pueden ser grandes. Este límite tiene que
    # ir en línea con max_upload_bytes del backend.
    client_max_body_size 200M;

    # OJO: aquí NO puede haber un bloque `types { ... }`. Dentro de `server` o
    # `location`, `types` SUSTITUYE la tabla MIME entera en vez de ampliarla, y
    # entonces se pierde hasta `text/html`: el navegador se descarga el
    # index.html como fichero en lugar de abrir la aplicación.
    #
    # La tabla por defecto (/etc/nginx/mime.types) ya cubre html, css, js, json
    # y wasm. Los .bcmap, .pfb y .icc de pdf.js no están, pero caen en
    # `default_type application/octet-stream`, que es justo lo que necesitan.
    # El único que da problemas es .mjs: sin tipo acaba en octet-stream y
    # Chrome bloquea el módulo.
    location ~ \.mjs$ {
        default_type text/javascript;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Procesar un lote grande con OCR puede tardar. Sin esto, nginx corta
        # la subida o la descarga del ZIP a los 60 segundos.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # Los assets llevan hash en el nombre, así que se pueden cachear para
    # siempre sin riesgo de servir una versión vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index.html NO se cachea: es lo que apunta a los assets con hash.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA: cualquier ruta desconocida devuelve el index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
